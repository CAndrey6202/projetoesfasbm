<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema - Conectando</title>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f1f5f9; color: #1e293b; margin: 0; text-align: center; }
        .box { background: white; padding: 2.5rem 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); max-width: 420px; margin: 1rem; }
        h2 { margin-top: 0; color: #0f172a; font-size: 1.4rem; }
        p { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
        .btn { display: inline-block; padding: 0.6rem 1.4rem; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 600; text-decoration: none; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Servidor em atualização ou sem conexão</h2>
        <p>O sistema foi reiniciado para uma nova versão ou sua conexão oscilou. Clique no botão abaixo para recarregar.</p>
        <button class="btn" onclick="window.location.reload(true)">Recarregar Página</button>
    </div>
</body>
</html>
