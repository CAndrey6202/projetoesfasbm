services:
  - type: web
    name: sisgen-bm
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "FLASK_APP=backend.app flask db upgrade && python worker.py & gunicorn --workers 2 --threads 4 --timeout 120 --max-requests 500 --max-requests-jitter 50 'backend.app:create_app()'"
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: TZ
        value: America/Sao_Paulo
      # A variável DATABASE_URL agora deve ser inserida MANUALMENTE no painel do Render!
    disk:
      name: uploads-disk
      mountPath: /opt/render/project/src/static/uploads
      sizeGB: 1
