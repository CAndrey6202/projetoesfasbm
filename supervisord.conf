[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:web]
command=gunicorn --workers 2 --threads 4 --timeout 120 --max-requests 500 --max-requests-jitter 50 "backend.app:create_app()"
directory=/opt/render/project/src
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=python worker.py
environment=PYTHONUNBUFFERED=1
directory=/opt/render/project/src
autostart=true
autorestart=true
stdout_logfile=/opt/render/project/src/worker.log
stdout_logfile_maxbytes=0
stderr_logfile=/opt/render/project/src/worker.log
stderr_logfile_maxbytes=0